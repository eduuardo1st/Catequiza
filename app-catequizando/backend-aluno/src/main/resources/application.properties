spring.application.name=catequiza-backend-aluno
server.port=8081

## Banco PostgreSQL compartilhado (Shared Database Pattern)
## Valores locais sao sobrescritos em producao (Render) via Relaxed Binding:
## SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catequiza-test}
spring.datasource.username=${DB_USERNAME:catequiza}
spring.datasource.password=${DB_PASSWORD:catequiza}

## REGRA CRITICA: o backend-aluno NAO pode migrar o schema compartilhado.
## Apenas o backend-admin executa Flyway (evita locks e conflitos de migracao).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=false
