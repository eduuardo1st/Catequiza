name: lint-backend

on:
  pull_request:
    paths:
      - "backend/**"
  push:
    branches:
      - dev
    paths:
      - "backend/**"

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: cd backend && mvn -B validate process-classes