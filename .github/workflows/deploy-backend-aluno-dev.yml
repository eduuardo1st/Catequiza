name: Build and Push Backend Aluno

on:
  push:
    branches:
      - dev
    paths:
      - 'app-catequizando/backend-aluno/**'
      - '.github/workflows/deploy-backend-aluno-dev.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./app-catequizando/backend-aluno
          file: ./app-catequizando/backend-aluno/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/catequiza-backend-aluno:dev
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catequiza-backend-aluno:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catequiza-backend-aluno:buildcache,mode=max
      - if: success()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND_ALUNO }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND_ALUNO }}
          fi