name: lint-backend-aluno

on:
  pull_request:
    paths:
      - "app-catequizando/backend-aluno/**"
  push:
    branches:
      - dev
    paths:
      - "app-catequizando/backend-aluno/**"

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: cd app-catequizando/backend-aluno && mvn -B validate process-classes