name: Build and Push Backend Admin

on:
  push:
    branches:
      - dev
    paths:
      - 'app-catequista/backend-admin/**'
      - '.github/workflows/deploy-backend-admin-dev.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./app-catequista/backend-admin
          file: ./app-catequista/backend-admin/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/catequiza-backend-admin:dev
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catequiza-backend-admin:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catequiza-backend-admin:buildcache,mode=max
      - if: success()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND_ADMIN }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND_ADMIN }}
          fi