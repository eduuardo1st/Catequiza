name: lint-backend-admin

on:
  pull_request:
    paths:
      - "app-catequista/backend-admin/**"
  push:
    branches:
      - dev
    paths:
      - "app-catequista/backend-admin/**"

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - run: cd app-catequista/backend-admin && mvn -B validate process-classes