name: Build and Push Backend

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend-dev.yml'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/catequiza-backend:dev
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catequiza-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/catequiza-backend:buildcache,mode=max
      - if: success()
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND }}" ]; then
            curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL_BACKEND }}
          fi