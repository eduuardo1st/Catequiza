name: revert-direct-push

on:
  push:
    branches:
      - main
      - homolog

jobs:
  enforce-protection:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.before }}
      - id: inspect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          REF: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            echo "is_legitimate=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          PARENTS=$(git cat-file -p "$AFTER" 2>/dev/null | grep -c "^parent " || echo 0)
          MESSAGE=$(git log --format="%s" -1 "$AFTER" 2>/dev/null || echo "unknown")
          if [ "$PARENTS" -ge 2 ]; then
            echo "is_legitimate=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if git merge-base --is-ancestor "$AFTER" "$BEFORE" 2>/dev/null; then
            echo "is_legitimate=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          if echo "$MESSAGE" | grep -qi "cherry.pick\|hotfix"; then
            echo "is_legitimate=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "is_legitimate=false" >> $GITHUB_OUTPUT
      - if: steps.inspect.outputs.is_legitimate == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          ACTOR: ${{ github.actor }}
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"
          MESSAGE=$(git log --format="%s" -1 "$AFTER" 2>/dev/null || echo "unknown")
          if git push origin "$BEFORE:$BRANCH" --force 2>&1; then
            printf -v BODY "Push Direto Revertido Automaticamente\nBranch: %s\nAutor: %s" "$BRANCH" "$ACTOR"
            gh issue create --title "Revertido push em $BRANCH" --label "tipo/fix" --assignee "$ACTOR" --body "$BODY"
            exit 0
          else
            exit 1
          fi