spring.application.name=catequiza-backend-admin
server.port=8080

## Banco PostgreSQL compartilhado (Shared Database Pattern)
## Valores locais sao sobrescritos em producao (Render) via Relaxed Binding:
## SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:catequiza-test}
spring.datasource.username=${DB_USERNAME:catequiza}
spring.datasource.password=${DB_PASSWORD:catequiza}

## Flyway e o unico responsavel pelas migracoes do schema compartilhado.
## REGRA CRITICA: apenas o backend-admin pode migrar o banco.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
